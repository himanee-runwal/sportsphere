spring.application.name=gateway-service
server.port=8082
spring.config.import=optional:file:../.env[.properties]

# Spring Cloud Gateway Routing Rules
# Route /api/v1/auth/** to auth-service
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=${AUTH_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/auth/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=AuthenticationFilter

# Route /api/v1/sports/** to sports-service
spring.cloud.gateway.server.webflux.routes[1].id=sports-service
spring.cloud.gateway.server.webflux.routes[1].uri=${SPORTS_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/sports/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=AuthenticationFilter

# Route /api/v1/booking/** to booking-service
spring.cloud.gateway.server.webflux.routes[2].id=booking-service
spring.cloud.gateway.server.webflux.routes[2].uri=${BOOKING_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/booking/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=AuthenticationFilter

# JWT Configuration
application.security.jwt.secret-key=${JWT_SECRET_KEY}
